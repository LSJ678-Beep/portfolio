<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星际虫潮 · 3D 打怪升级射击</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #16233d 0%, #0a0f1a 55%, #05070c 100%);
    color: #e8eefc;
    overflow: hidden;
    padding: 24px;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; }
  .star {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .8; } }

  .panel {
    position: relative; z-index: 2;
    text-align: center; padding: 52px 46px;
    max-width: 620px; width: 100%;
    background: rgba(16, 26, 44, .55);
    border: 1px solid rgba(94, 234, 212, .18);
    border-radius: 22px;
    backdrop-filter: blur(14px);
    box-shadow: 0 24px 80px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .03) inset;
  }
  .badge {
    display: inline-block; margin-bottom: 20px;
    padding: 6px 16px; border-radius: 999px;
    font-size: 12px; letter-spacing: .16em;
    color: #5eead4; border: 1px solid rgba(94, 234, 212, .35);
    background: rgba(94, 234, 212, .08);
  }
  h1 {
    font-size: 46px; line-height: 1.15; letter-spacing: .06em;
    background: linear-gradient(135deg, #fff 20%, #7dd3fc 60%, #5eead4 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .sub { margin-top: 14px; font-size: 15px; color: #8ea3c4; letter-spacing: .05em; }

  .play {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 34px; padding: 17px 50px;
    font-size: 19px; font-weight: 600; letter-spacing: .1em;
    color: #041419; text-decoration: none;
    background: linear-gradient(135deg, #5eead4, #38bdf8);
    border-radius: 14px;
    box-shadow: 0 10px 34px rgba(56, 189, 248, .38);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .play:hover { transform: translateY(-3px); box-shadow: 0 16px 46px rgba(56, 189, 248, .5); }
  .play:active { transform: translateY(-1px); }

  .keys {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 11px 24px; margin-top: 38px; text-align: left;
  }
  .key { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: #9fb3d1; }
  .key b {
    flex: none; min-width: 66px; text-align: center; padding: 4px 8px;
    border-radius: 6px; font-size: 11.5px; font-weight: 600;
    color: #cdeafe; background: rgba(125, 211, 252, .12);
    border: 1px solid rgba(125, 211, 252, .28);
  }
  .tip { margin-top: 26px; font-size: 12.5px; color: #5f728f; }
  @media (max-width: 560px) {
    h1 { font-size: 34px; }
    .panel { padding: 38px 24px; }
    .keys { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="panel">
  <div class="badge">THREE.JS · 3D 射击 · 打怪升级</div>
  <h1>星际虫潮</h1>
  <p class="sub">鼠标左键开枪 · 击杀升级 · 自由搭配强化</p>

  <a class="play" href="./threejs-templates/游戏模板C-星际虫潮.html">开始游戏 ▸</a>

  <div class="keys">
    <div class="key"><b>W A S D</b>移动</div>
    <div class="key"><b>鼠标左键</b>开枪（按住连射）</div>
    <div class="key"><b>Shift / 空格</b>冲刺闪避</div>
    <div class="key"><b>Esc</b>暂停</div>
  </div>

  <p class="tip">建议使用 Chrome / Edge 打开，横屏体验更佳</p>
</div>

<script>
  // 生成随机的背景星空
  const box = document.getElementById('stars');
  let html = '';
  for (let i = 0; i < 110; i++) {
    const size = (Math.random() * 2.2 + 0.6).toFixed(2);
    html += '<span class="star" style="'
      + 'left:' + (Math.random() * 100).toFixed(2) + '%;'
      + 'top:' + (Math.random() * 100).toFixed(2) + '%;'
      + 'width:' + size + 'px;height:' + size + 'px;'
      + 'animation-delay:' + (Math.random() * 3).toFixed(2) + 's;'
      + 'opacity:' + (Math.random() * 0.6 + 0.1).toFixed(2) + ';"></span>';
  }
  box.innerHTML = html;
</script>
</body>
</html>
